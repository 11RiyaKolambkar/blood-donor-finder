name: blood_donor_finder
description: PulseNet — Emergency Healthcare Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Core State & HTTP
  provider: ^6.1.2
  http: ^1.2.2
  web: ^1.1.0
  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.4
  # Location & Storage
  geolocator: ^13.0.2
  shared_preferences: ^2.3.2
  # Utils
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
